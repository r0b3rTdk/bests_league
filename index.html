<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bests League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- CSS dividido por responsabilidade — veja README.md -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/player-cards.css">
</head>
<body>

<div id="blLoadingScreen" class="bl-loading-overlay">
  <div class="bl-loading-container">
    <h1 class="bl-loading-logo">BESTS LEAGUE</h1>
    <div class="bl-trap-pulse"></div>
    <span class="bl-loading-status">Conectando...</span>
  </div>
</div>

<div id="app" class="bl-root">

  <header class="bl-header">
    <div class="bl-header-inner">
      <div class="bl-brand">
        <div class="bl-brand-badge">BL</div>
        <div>
          <p class="bl-brand-title">BESTS LEAGUE</p>
          <p class="bl-brand-sub" id="temporadaAtualLabel">Temporada</p>
        </div>
      </div>
      <div class="bl-header-actions">
        <select id="temporadaSelect" class="bl-temporada-select" title="Trocar de temporada"></select>
        <span id="savingIndicator" class="bl-saving-indicator" style="display:none;">
          <span class="bl-saving-dot"></span> Salvando...
        </span>
        
        <button type="button" class="bl-btn-primary bl-btn-novo" id="btnNovoJogo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Novo jogo
        </button>

        <span id="syncIndicator" class="bl-sync-indicator"></span>
      </div>
    </div>
  </header>

  <main class="bl-main">

    <section class="bl-hero" id="heroSection">
      <p class="bl-hero-label">ÚLTIMO RESULTADO</p>
      <div id="heroScoreboard"></div>
    </section>

    <div class="bl-confronto-bar bl-confronto-bar-vertical" id="confrontoBar"></div>

    <nav class="bl-tabs" id="tabsNav">
      <button type="button" class="bl-tab bl-tab-active" data-tab="inicio">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M5 3h14v6a7 7 0 0 1-14 0V3z"/><path d="M5 9H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h2M19 9h2a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2"/></svg>
        Início
      </button>
      <button type="button" class="bl-tab" data-tab="calendario">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Calendário
      </button>
      <button type="button" class="bl-tab" data-tab="artilharia">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        Artilharia
      </button>
      <button type="button" class="bl-tab" data-tab="disciplina">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        Cartões
      </button>
      <button type="button" class="bl-tab" data-tab="craques">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 9 22 9 16 14 18 21 12 17 6 21 8 14 2 9 9 9"/></svg>
        Craque do jogo
      </button>
      <button type="button" class="bl-tab bl-tab-jogadores" data-tab="jogadores">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Jogadores
      </button>
    </nav>

    <div id="tabContent"></div>

    <footer class="bl-footer">
      <button type="button" class="bl-footer-btn">Desenvolvido por r0b3rT</button>
    </footer>
  </main>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script src="js/firebase-init.js"></script>

<!-- Núcleo de dados e estado -->
<script src="js/historico/temporada_2025.js"></script> <!-- ADICIONE ESTA LINHA -->
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/calc.js"></script>

<!-- Renderização (telas) -->
<script src="js/render/helpers.js"></script>
<script src="js/render/header-hero.js"></script>
<script src="js/render/abas.js"></script>
<script src="js/render/jogadores-cards.js"></script>
<script src="js/render/geral.js"></script>

<!-- Modais -->
<script src="js/modals/shared.js"></script>
<script src="js/modals/jogo.js"></script>
<script src="js/modals/elenco.js"></script>
<script src="js/modals/temporada.js"></script>

<!-- Inicialização -->
<script src="js/app.js"></script>
</body>
</html>
